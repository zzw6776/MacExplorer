name: Build Explorer DMG
"on":
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Show selected toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test Swift and release behavior
        run: |
          zsh scripts/test.sh
          python3 -m unittest discover -s Tests/ReleaseTests -v
      - name: Build universal development app
        env:
          EXPLORER_LOCAL_SIGNING_IDENTITY: '-'
        run: zsh scripts/build.sh --universal
      - name: Validate shell scripts
        run: |
          for script in scripts/*.sh; do zsh -n "$script"; done
      - name: Keep test crash reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Explorer-test-crash-reports-${{ github.run_number }}
          path: ~/Library/Logs/DiagnosticReports/ExplorerPackageTests*
          if-no-files-found: ignore
          retention-days: 7
  dmg:
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      EXPLORER_LOCAL_SIGNING_IDENTITY: 'Mac Development: Explorer Self-Signed'
      EXPLORER_LOCAL_SIGNING_SHA1: ${{ vars.EXPLORER_DEV_CERT_SHA1 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Import the fixed development signing identity
        env:
          EXPLORER_DEV_P12_BASE64: ${{ secrets.EXPLORER_DEV_P12_BASE64 }}
          EXPLORER_DEV_P12_PASSWORD: ${{ secrets.EXPLORER_DEV_P12_PASSWORD }}
        run: zsh scripts/ci-dev-keychain.sh
      - name: Build universal app and DMG
        run: zsh scripts/dev-dmg.sh --universal
      - name: Upload DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MacExplorer-DMG-${{ github.run_number }}
          path: |
            build/dmg/*.dmg
            build/dmg/checksums.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Remove temporary signing material
        if: always()
        run: zsh scripts/ci-dev-keychain.sh --cleanup
